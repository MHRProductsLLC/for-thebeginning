<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>WEAPON X // containment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* ============================================================
   WEAPON X // CONTAINMENT — a snarky lab AI babysitting a mutant.
   All bark. A soft, un-admitted center.
   ============================================================ */
:root{
  --bg:#07090a;
  --green:#5ef38c;      /* the system voice */
  --green-dim:#3a9d5d;
  --amber:#ffb454;      /* the SASS — warnings, jabs, the antagonist */
  --amber-dim:#b47d38;
  --pink:#ff9bb5;       /* the undertone that leaks through */
  --pink-dim:#c97b92;
  --blue:#6fb2ff;       /* wolverine blue */
  --yellow:#ffd23f;     /* wolverine yellow */
  --mono:'JetBrains Mono', ui-monospace, monospace;
  --crt:'VT323', var(--mono);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(ellipse at center, #0c1010 0%, #050606 70%, #020303 100%);
  color:var(--green);
  font-family:var(--mono);
  display:flex; align-items:center; justify-content:center;
  padding:20px; min-height:100%;
  -webkit-font-smoothing:antialiased;
}
.monitor{
  position:relative; width:100%; max-width:920px; height:min(80vh,660px);
  background:var(--bg);
  border-radius:14px;
  border:1px solid #1e1512;
  box-shadow:0 0 0 6px #0a0d0c, 0 0 60px rgba(255,180,84,.05), inset 0 0 120px rgba(0,0,0,.6);
  overflow:hidden;
}
.scanlines{position:absolute; inset:0; pointer-events:none; z-index:30;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.16) 3px);}
.vignette{position:absolute; inset:0; pointer-events:none; z-index:29;
  box-shadow:inset 0 0 140px rgba(0,0,0,.75);}
.flicker{animation:flick 7s infinite}
@keyframes flick{0%,100%{opacity:1}96%{opacity:1}96.5%{opacity:.78}97%{opacity:1}}

.screen{position:absolute; inset:0; padding:22px 22px 16px; overflow-y:auto; z-index:10;
  font-size:15px; line-height:1.5;}
.screen::-webkit-scrollbar{width:8px}
.screen::-webkit-scrollbar-thumb{background:#2a1f12; border-radius:8px}
.ln{margin:1px 0; white-space:pre-wrap; word-break:break-word}
.g{color:var(--green)} .gd{color:var(--green-dim)} .am{color:var(--amber)} .amd{color:var(--amber-dim)}
.pk{color:var(--pink)} .pkd{color:var(--pink-dim)} .bl{color:var(--blue)} .yl{color:var(--yellow)}
.cmd-echo{color:var(--green)}
.cmd-echo .pr{color:var(--amber-dim)}
a{color:var(--pink); text-decoration:underline; text-underline-offset:2px}

.inrow{display:flex; align-items:baseline; gap:8px; margin-top:6px; z-index:10; position:relative}
.prompt{color:var(--amber-dim); white-space:nowrap}
#cmd{flex:1; background:transparent; border:none; outline:none; color:var(--green);
  font-family:var(--mono); font-size:15px; caret-color:var(--amber)}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* ============================================================
   THE DANGER ROOM — 2D platformer overlay
   ============================================================ */
#dangerroom{position:absolute; inset:0; z-index:20; display:none; background:#05070a}
#dangerroom canvas{display:block; width:100%; height:100%; image-rendering:pixelated; touch-action:none}
.overlay{position:absolute; inset:0; display:none; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; gap:14px;
  background:rgba(4,6,9,.86); z-index:21; padding:24px}
.overlay h2{font-family:var(--crt); font-size:46px; margin:0; letter-spacing:2px; color:var(--yellow)}
.overlay p{margin:0; max-width:34ch; color:var(--green); font-size:15px; line-height:1.5}
.overlay .small{color:var(--green-dim); font-size:13px}
.key{display:inline-block; padding:2px 8px; border:1px solid var(--amber-dim); border-radius:5px; color:var(--amber); font-size:13px}
.btn{margin-top:6px; padding:9px 20px; background:transparent; border:1px solid var(--yellow); color:var(--yellow);
  font-family:var(--mono); font-size:15px; border-radius:8px; cursor:pointer; letter-spacing:1px}
.btn:hover{background:rgba(255,210,63,.12)}

/* touch controls */
#touchpad{position:absolute; inset:0; z-index:22; display:none; pointer-events:none}
.tbtn{position:absolute; bottom:18px; width:64px; height:64px; border-radius:50%;
  border:1px solid rgba(255,180,84,.5); background:rgba(10,14,16,.55); color:var(--amber);
  font-family:var(--mono); font-size:13px; display:flex; align-items:center; justify-content:center;
  pointer-events:auto; user-select:none; touch-action:none}
#t-left{left:16px} #t-right{left:92px} #t-jump{right:92px} #t-atk{right:16px; border-color:rgba(255,210,63,.6); color:var(--yellow)}

.toast{position:absolute; top:14px; right:14px; z-index:45; background:#140f0c; border:1px solid var(--amber-dim); color:var(--amber); font-size:13px; padding:8px 12px; border-radius:8px; opacity:0; transform:translateY(-8px); transition:opacity .3s, transform .3s}
.toast.show{opacity:1; transform:translateY(0)}

@media (prefers-reduced-motion: reduce){ .flicker{animation:none} .blink{animation:none} }
@media (max-width:560px){
  .screen{font-size:13px} .overlay h2{font-size:34px}
  #touchpad{display:block}
}
</style>
</head>
<body>
<div class="monitor flicker">
  <div class="screen" id="screen">
    <div id="out"></div>
    <div class="inrow" id="inrow" style="display:none">
      <span class="prompt" id="ps1">asset@weaponx ~ %</span>
      <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="terminal command input" />
    </div>
  </div>

  <!-- THE DANGER ROOM -->
  <div id="dangerroom">
    <canvas id="game"></canvas>
    <div id="touchpad">
      <div class="tbtn" id="t-left">◀</div>
      <div class="tbtn" id="t-right">▶</div>
      <div class="tbtn" id="t-jump">JUMP</div>
      <div class="tbtn" id="t-atk">SNIKT</div>
    </div>
    <div class="overlay" id="dr-start">
      <h2>THE DANGER ROOM</h2>
      <p>you're the asset now. clear the sim, try not to throw out your back.</p>
      <p class="small"><span class="key">A D</span> / arrows move &nbsp;·&nbsp; <span class="key">W</span> / space jump &nbsp;·&nbsp; <span class="key">J</span> / K claws</p>
      <p class="small">survive the horde, then handle whatever crawls out last. <span class="key">esc</span> quits anytime.</p>
      <button class="btn" id="dr-go">ENTER THE ROOM</button>
    </div>
    <div class="overlay" id="dr-end">
      <h2 id="dr-title">SIM CLEARED</h2>
      <p id="dr-msg"></p>
      <p class="small" id="dr-score"></p>
      <button class="btn" id="dr-again">RUN IT BACK</button>
      <p class="small"><span class="key">esc</span> back to terminal</p>
    </div>
  </div>

  <div class="vignette"></div>
  <div class="scanlines"></div>
</div>

<script>
/* ============================================================================
   ❤  EDIT ZONE  ❤   — everything worth changing lives up here.
   ============================================================================ */
const CALLSIGN   = "TheBeginning";     // his codename / gamertag
const HANDLER    = "the handler";      // how the soft undertone signs off (avoid "love")
const OLD_UNIT   = "42";               // fake "years in containment" gag number (his-ish age vibe, optional)
const TRUCE_AT   = 4;                  // commands he must run before `truce` softens fully

// jabs the system throws while pretending it isn't fond of him
const SNIKT_LINES = [
  "SNIKT. relax, brat, you'll strain something.",
  "claws out. very scary. now take your supplements.",
  "SNIKT — careful swinging those around at your age, cradle robber.",
  "adamantium deployed. adamantium hips sold separately.",
  "menacing. also it's past your bedtime.",
  "ok tough guy. the normy gym folk are shaking. (they're not.)",
];

// `regen` — healing factor status, entirely age-gap slander
const REGEN = [
  "healing factor: nominal. joints: filing a complaint.",
  "regenerating... slower than usual. it's called being ANCIENT, look into it.",
  "cells repairing. hip: pending. i've pre-booked the retirement home just in case.",
  "you'll live. unfortunately for the gym normies, forever.",
  "vitals stable. Life Alert on standby, per protocol.",
  "back fully healed. the back pain, however, is a lifestyle now.",
];

// `dossier` — the classified file on him
const DOSSIER = [
  {k:"designation", v:CALLSIGN, c:"yl"},
  {k:"species",     v:"mutant (self-identifies as 'still got it')", c:"g"},
  {k:"age",         v:"classified. old enough to remember dial-up.", c:"am"},
  {k:"powers",      v:"horror trivia, unreasonable competence, being annoyingly right", c:"g"},
  {k:"weakness",    v:"me. also stairs, allegedly.", c:"pk"},
  {k:"threat lvl",  v:"high (to Sentinels). moderate (to his own knees).", c:"am"},
  {k:"handler note",v:"do NOT tell him he's my favorite. it'll go to his head.", c:"pkd"},
];

// `bestiary` — his 'monsters' reframed. horror menu, affectionate roast.
const BESTIARY = [
  {n:"THE DOUBT",    d:"claims you're not enough. lies. i've reviewed the footage — you're a menace and a marvel. filed as: nonsense."},
  {n:"THE STAIRCASE",d:"natural predator of men your age. take them one at a time, old man, i'm not carrying you."},
  {n:"THE GYM NORMY", d:"grunts, curls, exists. no threat detected. you'd out-nerd it into the sun."},
  {n:"MONDAY",       d:"recurring boss. no i-frames. survivable only with coffee and spite. you have both."},
  {n:"THE 9PM YAWN", d:"strikes without warning. resistance is futile, grandpa. rest is allowed."},
];

// pop-up quips when you banish an enemy in THE DANGER ROOM
const KILL_QUIPS = [
  "was that your hip or the Sentinel?",
  "not bad for someone who remembers VHS",
  "ok grandpa, show off",
  "still got it, cradle robber",
  "i'll allow it, brat",
  "careful, you'll pull something",
  "geriatric AND lethal. cute.",
  "the gym normies could NEVER",
  "matinee hero strikes again",
  "fine. that was kind of hot. moving on.",
  "don't gloat, it's almost bingo night",
  "menace. absolute menace.",
];

// `truce` — the sass drops. undertone only. NEVER the L word.
const TRUCE_LOCKED = [
  "no. you haven't earned it. poke around more first, brat.",
];
const TRUCE = [
  "ugh. fine. off the record —",
  "you're insufferable, and i'd still pick you for my team. every single run.",
  "the age gap is a rounding error. you're the least boring person in any room.",
  "when it gets heavy, put it down. i'm not going anywhere — someone has to keep you humble.",
  "you're kind of everything. don't make it weird. — "+HANDLER,
];

// the reveal for CLEARING the danger room (undertone, no L word)
const CLEAR_REVEAL = "sim cleared, old man. don't let it go to your head... i'd run every level with you. now go ice those knees.";
const FAIL_REVEAL  = "down but not out — that healing factor's carrying you AND your bad decisions. shake it off, brat. run it back.";

/* ============================================================================
   ⚙  ENGINE
   ============================================================================ */
const out = document.getElementById('out');
const screen = document.getElementById('screen');
const inrow = document.getElementById('inrow');
const cmd = document.getElementById('cmd');

function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

let visits = parseInt(lsGet('wx_visits','0'),10)+1;
lsSet('wx_visits', String(visits));
let best = parseInt(lsGet('wx_best','0'),10);
let trust = parseInt(lsGet('wx_trust','0'),10);
function addTrust(){ trust++; lsSet('wx_trust', String(trust)); }

function print(html, cls){
  const d=document.createElement('div');
  d.className='ln'+(cls?(' '+cls):'');
  d.innerHTML=html;
  out.appendChild(d);
  screen.scrollTop=screen.scrollHeight;
  return d;
}
function spacer(){ print('&nbsp;'); }

/* ---- boot ---- */
const BOOT = [
  {t:"asset@weaponx ~ % ./containment --wake", c:"g"},
  {t:"> powering cages ..........", c:"gd"},
  {t:"> motion in cell block. again.", c:"am", slow:true},
  {t:"> running threat assessment ▓▓▓▓▓▒░ 81%", c:"gd"},
  {t:'> asset identified: "'+CALLSIGN+'"', c:"yl", slow:true},
  {t:"> claws: sharp. attitude: sharper. hips: under review.", c:"am"},
  {t:"> verdict: dangerously loveable. containment: impossible.", c:"pk", slow:true},
  {t:"", c:"g"},
  {t:"> ...ugh. it's you again. i JUST cleaned this cell.", c:"amd"},
  {t:"> fine. you're stuck with me, cradle robber. don't touch anything.", c:"gd"},
  {t:"", c:"g"},
  {t:'type "help" and hit enter. try not to break a hip.', c:"g"},
];
let booting=true;
function typeLine(text, cls){
  return new Promise(res=>{
    const d=print('', cls); let i=0;
    const speed = (cls==='am'||cls==='pk'||cls==='yl') ? 24 : 9;
    (function step(){
      if(!booting){ d.innerHTML=text; res(); return; }
      d.innerHTML = text.slice(0,i) + (i<text.length?'<span class="blink">▋</span>':'');
      screen.scrollTop=screen.scrollHeight;
      if(i++<text.length) setTimeout(step, speed); else { d.innerHTML=text; res(); }
    })();
  });
}
async function boot(){
  if(visits>1) print('<span class="amd">> re-entry #'+visits+'. of course. can\'t stay away from me, huh.</span>');
  for(const l of BOOT){
    await typeLine(l.t, l.c);
    if(l.slow && booting) await new Promise(r=>setTimeout(r,170));
  }
  booting=false;
  inrow.style.display='flex';
  cmd.focus();
  state='term';
}
function skipBoot(){ if(booting){ booting=false; } }
screen.addEventListener('click', ()=>{ if(booting) skipBoot(); else cmd.focus(); });

/* ---- commands ---- */
const COMMANDS = {
  help(){
    print('<span class="amd">// ugh. fine. here\'s what you\'re allowed to touch:</span>');
    print('  <span class="g">snikt</span>      <span class="gd">— pop the claws. show off. i\'ll pretend not to watch.</span>');
    print('  <span class="g">regen</span>      <span class="gd">— your healing factor status. spoiler: the joints lost.</span>');
    print('  <span class="g">dossier</span>    <span class="gd">— the classified file i keep on you.</span>');
    print('  <span class="g">adamantium</span> <span class="gd">— skeleton diagnostics, tough guy.</span>');
    print('  <span class="g">bestiary</span>   <span class="gd">— the monsters you actually face. cute.</span>');
    print('  <span class="g">lights</span>     <span class="gd">— kill the lights. i dare you.</span>');
    print('  <span class="g">dangerroom</span> <span class="gd">— <span class="yl">THE DANGER ROOM</span> · you, claws, a horde. go.</span>');
    print('  <span class="g">lifealert</span>  <span class="gd">— for emergencies. you\'re at that age.</span>');
    print('  <span class="g">trust</span>      <span class="gd">— my current opinion of you. don\'t get excited.</span>');
    print('  <span class="g">truce</span>      <span class="gd">— '+(trust>=TRUCE_AT?'...off the record.':'locked. earn it, brat.')+'</span>');
    print('  <span class="g">clear</span>      <span class="gd">— wipe the screen. hiding evidence, i see.</span>');
    print('<span class="amd">(i left some things off the list. you\'re nosy. you\'ll find them.)</span>');
    addTrust();
  },
  snikt(){ print('<span class="yl">*SNIKT*</span> <span class="am">'+pick(SNIKT_LINES)+'</span>'); addTrust(); },
  regen(){
    print('<span class="gd">◌ healing factor engaged...</span>');
    print('<span class="am">'+pick(REGEN)+'</span>'); addTrust();
  },
  dossier(){
    print('<span class="amd">// CLASSIFIED — WEAPON X FILE</span>');
    DOSSIER.forEach(r=> print('  <span class="gd">'+r.k.padEnd(12)+'</span><span class="'+r.c+'">'+r.v+'</span>'));
    print('<span class="amd">// leak this and i\'ll deny everything.</span>'); addTrust();
  },
  adamantium(){
    print('<span class="gd">scanning skeleton .......... </span>');
    print('<span class="bl">> adamantium: 100%. structurally, you\'re unbreakable.</span>');
    print('<span class="am">> everything else: held together by caffeine and spite.</span>');
    print('<span class="pkd">> ...it\'s a good skeleton. don\'t tell anyone i said that.</span>'); addTrust();
  },
  bestiary(){
    print('<span class="amd">// KNOWN THREATS — handle with claws:</span>');
    BESTIARY.forEach(b=>{ print('  <span class="yl">▸ '+b.n+'</span>'); print('    <span class="gd">'+b.d+'</span>'); });
    addTrust();
  },
  lights(){ lightsGag(); addTrust(); },
  lifealert(){
    print('<span class="am">📟 LIFE ALERT armed.</span>');
    print('<span class="gd">"help, i\'ve fallen for a cradle robber and i can\'t get up."</span>');
    print('<span class="pkd">relax. i\'d catch you. every time. (this message will self-destruct out of embarrassment.)</span>'); addTrust();
  },
  dangerroom(){ startDR(); },
  play(){ startDR(); },
  trust(){ trustCmd(); },
  stats(){ trustCmd(); },
  truce(){ truceCmd(); },
  secret(){ truceCmd(); },
  clear(){ out.innerHTML=''; },
  whoami(){ print('<span class="pk">the most dangerous asset in this building. also my favorite. it\'s you, '+CALLSIGN+'.</span>'); addTrust(); },
  'sudo shutdown'(){ print('<span class="am">request denied. you don\'t get to leave. sit, brat.</span>'); },
  'sudo rm -rf doubt'(){ print('<span class="g">purging doubt/ ...</span>'); print('<span class="pkd">done. it regrows sometimes — that\'s what i\'m here for. now stop it.</span>'); addTrust(); },
  'man logan'(){ print('<span class="gd">LOGAN(1)              WEAPON X manual</span>'); print('<span class="g">NAME   '+CALLSIGN+' — asset, menace, cradle robber</span>'); print('<span class="g">USAGE  point at problem. deploy claws. reheat coffee.</span>'); },
  'ls feelings'(){ print('<span class="am">access denied. that directory is ENCRYPTED and you know it.</span>'); print('<span class="pkd">...it\'s not empty, though. that\'s all you get.</span>'); addTrust(); },
};

function run(raw){
  const ps=document.getElementById('ps1');
  print('<span class="cmd-echo"><span class="pr">'+(ps?ps.textContent:'asset@weaponx ~ %')+'</span> '+raw.replace(/</g,'&lt;')+'</span>');
  const c=raw.trim().toLowerCase().replace(/\s+/g,' ');
  if(c==='') return;
  if(COMMANDS[c]) COMMANDS[c]();
  else { print('<span class="am">command not found: '+c.replace(/</g,'&lt;')+'</span>'); print('<span class="gd">try "help", old man. or "snikt" if you\'re feeling brave.</span>'); }
  spacer();
}
cmd.addEventListener('keydown', e=>{ if(e.key==='Enter'){ const v=cmd.value; cmd.value=''; run(v); } });

/* ---- trust + truce ---- */
function trustCmd(){
  const lvl = trust>=12?'grudging respect' : trust>=8?'mildly impressed' : trust>=TRUCE_AT?'warming up (don\'t push it)' : 'suspicious';
  const bar = '■'.repeat(Math.min(12,trust)) + '□'.repeat(Math.max(0,12-trust));
  print('<span class="amd">// current opinion of '+CALLSIGN+':</span>');
  print('  trust ['+ '<span class="am">'+bar+'</span>' +'] '+Math.min(12,trust)+'/12');
  print('  status ......... <span class="g">'+lvl+'</span>');
  print('  visits ......... <span class="g">'+visits+'</span>');
  print('  danger room best <span class="g">'+Math.max(best,parseInt(lsGet('wx_best','0'),10))+'</span>');
  print('  cradle-robbing .. <span class="pk">shamelessly ongoing</span>');
  print('<span class="amd">// '+(trust>=TRUCE_AT?'"truce" is unlocked. use it wisely.':'keep poking around to unlock "truce".')+'</span>');
}
function truceCmd(){
  if(trust<TRUCE_AT){
    print('<span class="am">'+pick(TRUCE_LOCKED)+'</span>');
    print('<span class="gd">('+trust+'/'+TRUCE_AT+' — run more commands, nosy.)</span>');
    return;
  }
  print('<span class="amd">> lowering weapons. this stays between us.</span>');
  TRUCE.forEach((t,i)=> setTimeout(()=>{ print('<span class="'+(i>=1?'pk':'gd')+'">'+t+'</span>'); screen.scrollTop=screen.scrollHeight; }, i*650));
}

/* ---- lights (fake jumpscare -> heart) ---- */
function lightsGag(){
  const m=document.querySelector('.monitor');
  const black=document.createElement('div');
  black.style.cssText='position:absolute;inset:0;z-index:44;background:#000;opacity:0;transition:opacity .25s';
  m.appendChild(black);
  requestAnimationFrame(()=>black.style.opacity='1');
  print('<span class="amd">> lights out. bold. spooky. very horror-movie of you.</span>');
  setTimeout(()=>{
    const flash=document.createElement('div');
    flash.style.cssText='position:absolute;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;color:#ff9bb5;font-family:var(--crt);font-size:120px';
    flash.textContent='♥';
    m.appendChild(flash);
    setTimeout(()=>{ flash.remove(); black.style.opacity='0'; setTimeout(()=>black.remove(),300);
      print('<span class="pk">BOO. it\'s just me. you thought it\'d be scary — it\'s just how much i put up with you. terrifying, i know.</span>'); spacer();
    },700);
  }, 1400+Math.random()*900);
}

/* ============================================================================
   THE DANGER ROOM — 2D Terraria-ish platformer
   ============================================================================ */
const dr = document.getElementById('dangerroom');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const drStart=document.getElementById('dr-start');
const drEnd=document.getElementById('dr-end');
const touchpad=document.getElementById('touchpad');

let VW=0, VH=0, DPR=Math.min(window.devicePixelRatio||1,2);
function resizeDR(){
  const r=canvas.getBoundingClientRect();
  VW=r.width; VH=r.height;
  canvas.width=VW*DPR; canvas.height=VH*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled=false;
}

const TILE=34;
const WORLD_W=64;                 // tiles wide
let world=[];                     // heightmap-based tiles
let cam=0;
let keys={};
let R=null;                       // run state
const QUOTA=14;                   // enemies to clear before the boss

function buildWorld(){
  // simple terraria-ish surface: a base ground + a few floating platforms
  world=[];
  const groundRow = 9;            // tiles from top where ground starts (in tile units, from bottom baseline computed at draw)
  for(let x=0;x<WORLD_W;x++){
    // gentle rolling surface
    const h = groundRow + Math.round(Math.sin(x*0.35)*1.2 + Math.sin(x*0.13)*1.6);
    world.push(h);
  }
}
// floating platforms: array of {tx,ty,tw}
let platforms=[];
function buildPlatforms(){
  platforms=[
    {tx:6, ty:5, tw:4},
    {tx:14, ty:7, tw:3},
    {tx:22, ty:4, tw:5},
    {tx:31, ty:6, tw:4},
    {tx:40, ty:5, tw:3},
    {tx:48, ty:7, tw:4},
    {tx:55, ty:5, tw:5},
  ];
}
function groundYatX(px){
  // world surface pixel y at world pixel x
  const tx=Math.floor(px/TILE);
  const col=Math.max(0,Math.min(WORLD_W-1,tx));
  const rowsFromTopBaseline = VH - world[col]*0 ; // placeholder, real calc below
  return VH - (world[col])*0; // unused
}
// We compute ground line as: surfaceY = VH - (SURFACE_TILES)*TILE, using world[] as tile height from bottom.
function surfaceYAt(worldX){
  const tx=Math.max(0,Math.min(WORLD_W-1,Math.floor(worldX/TILE)));
  return VH - world[tx]*TILE;
}

function startDR(){
  dr.style.display='block';
  resizeDR();
  drEnd.style.display='none';
  drStart.style.display='flex';
  state='dr-ready';
}
function exitDR(){
  if(R) R.over=true;
  cancelAnimationFrame(R&&R.raf);
  dr.style.display='none';
  touchpad.style.display='';
  state='term';
  cmd.focus();
  print('<span class="amd">> left the danger room. running away, old man? understandable.</span>'); spacer();
}
function newDR(){
  drStart.style.display='none'; drEnd.style.display='none';
  buildWorld(); buildPlatforms();
  const startX=3*TILE;
  R={
    p:{x:startX, y:surfaceYAt(startX)-60, w:26, h:40, vx:0, vy:0, onGround:false, facing:1,
       hp:100, maxHp:100, atk:0, invuln:0, blink:0},
    enemies:[], parts:[], floats:[],
    killed:0, spawnT:0, spawnEvery:78, boss:null, over:false, won:false, raf:0, t:0, shake:0
  };
  cam=0;
  state='dr';
  if('ontouchstart' in window) touchpad.style.display='block';
  R.raf=requestAnimationFrame(drLoop);
}

function spawnEnemy(){
  const fromLeft=Math.random()<0.5;
  const wx = fromLeft ? cam-30 : cam+VW+30;
  const kind = Math.random()<0.5 ? 'sentinel' : 'normy';
  const surf=surfaceYAt(wx);
  R.enemies.push({
    x:wx, y:surf-(kind==='sentinel'?52:44),
    w:kind==='sentinel'?30:26, h:kind==='sentinel'?52:44,
    vx:(fromLeft?1:-1)*(0.7+Math.random()*0.5), kind, hp:kind==='sentinel'?2:1, dead:false, hitFlash:0
  });
}
function spawnBoss(){
  const fromLeft=R.p.x>cam+VW/2;
  const wx=fromLeft ? cam-40 : cam+VW+40;
  const surf=surfaceYAt(wx);
  R.boss={ x:wx, y:surf-70, w:48, h:70, vx:(fromLeft?1:-1)*1.15, hp:8, maxHp:8, dead:false, hitFlash:0, lunge:0 };
  R.floats.push({t:"SABRETOOTH incoming. focus, cradle robber.", x:R.p.x, y:R.p.y-40, life:1.4, big:true});
}

function drHurt(dmg){
  const p=R.p;
  if(p.invuln>0) return;
  p.hp-=dmg; p.invuln=48; p.blink=48; R.shake=10;
  if(p.hp<=0){ p.hp=0; endDR(false); }
}
function clawHit(){
  const p=R.p;
  const reach=40;
  const hx = p.facing>0 ? p.x+p.w : p.x-reach;
  const box={x:hx, y:p.y-6, w:reach, h:p.h+12};
  let any=false;
  R.enemies.forEach(e=>{
    if(e.dead) return;
    if(box.x < e.x+e.w && box.x+box.w > e.x && box.y < e.y+e.h && box.y+box.h > e.y){
      e.hp--; e.hitFlash=8; any=true;
      if(e.hp<=0){ e.dead=true; R.killed++; enemyPop(e); }
    }
  });
  if(R.boss && !R.boss.dead){
    const b=R.boss;
    if(box.x < b.x+b.w && box.x+box.w > b.x && box.y < b.y+b.h && box.y+box.h > b.y){
      b.hp--; b.hitFlash=8; any=true; R.shake=6;
      for(let i=0;i<6;i++) R.parts.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:(Math.random()-.5)*6,vy:-Math.random()*5-1,life:1,sz:5+Math.random()*6});
      if(b.hp<=0){ b.dead=true; endDR(true); }
    }
  }
  if(any){ R.shake=Math.max(R.shake,5); }
}
function enemyPop(e){
  const q=pick(KILL_QUIPS);
  R.floats.push({t:q, x:e.x+e.w/2, y:e.y, life:1.1});
  for(let i=0;i<9;i++) R.parts.push({x:e.x+e.w/2,y:e.y+e.h/2,vx:(Math.random()-.5)*5,vy:-Math.random()*4-1,life:1,sz:4+Math.random()*6});
}

/* --- drawing --- */
function drawTerrain(){
  // sky
  const grd=ctx.createLinearGradient(0,0,0,VH);
  grd.addColorStop(0,'#0a0f14'); grd.addColorStop(1,'#05070a');
  ctx.fillStyle=grd; ctx.fillRect(0,0,VW,VH);
  // faint grid (danger room)
  ctx.strokeStyle='rgba(94,243,140,0.05)'; ctx.lineWidth=1;
  for(let gx=-(cam%TILE); gx<VW; gx+=TILE){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,VH); ctx.stroke(); }
  for(let gy=0; gy<VH; gy+=TILE){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(VW,gy); ctx.stroke(); }

  // ground tiles
  const startTx=Math.floor(cam/TILE)-1;
  const endTx=startTx+Math.ceil(VW/TILE)+2;
  for(let tx=startTx; tx<=endTx; tx++){
    const col=Math.max(0,Math.min(WORLD_W-1,tx));
    const surfY=VH - world[col]*TILE;
    const sx=tx*TILE - cam;
    // grass cap
    ctx.fillStyle='#2f6b3f'; ctx.fillRect(sx, surfY, TILE, 8);
    ctx.fillStyle='#3d8c52'; ctx.fillRect(sx, surfY, TILE, 3);
    // dirt
    ctx.fillStyle='#5a3d2a'; ctx.fillRect(sx, surfY+8, TILE, VH-surfY-8);
    // dirt speckle
    ctx.fillStyle='#4a3122';
    ctx.fillRect(sx+6, surfY+16, 4,4); ctx.fillRect(sx+20, surfY+30, 5,5);
    // tile edge
    ctx.strokeStyle='rgba(0,0,0,0.18)'; ctx.strokeRect(sx, surfY+8, TILE, VH-surfY-8);
  }
  // floating platforms (metal danger-room pads)
  platforms.forEach(pf=>{
    const px=pf.tx*TILE - cam, py=VH - pf.ty*TILE - platY_offset;
    const y = platPixelY(pf);
    const x = pf.tx*TILE - cam;
    ctx.fillStyle='#2a3138'; ctx.fillRect(x, y, pf.tw*TILE, 12);
    ctx.fillStyle='#3d4750'; ctx.fillRect(x, y, pf.tw*TILE, 4);
    ctx.strokeStyle='rgba(255,180,84,0.25)'; ctx.strokeRect(x, y, pf.tw*TILE, 12);
  });
}
const platY_offset=0;
function platPixelY(pf){ return VH - pf.ty*TILE; }

// player collision against a top surface at (worldX)
function feetSurfaceY(px){ return surfaceYAt(px); }

function drawWolverine(){
  const p=R.p;
  const sx=p.x-cam, sy=p.y;
  if(p.blink>0 && Math.floor(p.blink/4)%2===0){ /* skip draw for blink */ p.blink--; return; }
  ctx.save();
  ctx.translate(sx+p.w/2, sy+p.h/2);
  ctx.scale(p.facing,1);
  ctx.translate(-p.w/2,-p.h/2);
  // body (yellow suit)
  ctx.fillStyle='#ffd23f'; ctx.fillRect(4,14,18,20);
  // blue trunks/boots
  ctx.fillStyle='#3f6fd2'; ctx.fillRect(4,30,18,10);
  ctx.fillStyle='#3f6fd2'; ctx.fillRect(2,20,4,10); ctx.fillRect(20,20,4,10);
  // head + cowl (blue with points)
  ctx.fillStyle='#2f52a8'; ctx.fillRect(5,2,16,12);
  // cowl points
  ctx.beginPath(); ctx.moveTo(5,2); ctx.lineTo(2,-6); ctx.lineTo(9,2); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(21,2); ctx.lineTo(24,-6); ctx.lineTo(17,2); ctx.closePath(); ctx.fill();
  // face
  ctx.fillStyle='#e8b98f'; ctx.fillRect(8,8,10,6);
  // eye
  ctx.fillStyle='#111'; ctx.fillRect(13,9,3,2);
  // claws (only during attack)
  if(p.atk>0){
    ctx.strokeStyle='#e9edf2'; ctx.lineWidth=3; ctx.lineCap='round';
    const cx=24;
    for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(cx, 22+i*3); ctx.lineTo(cx+18, 16+i*3); ctx.stroke(); }
    // slash arc
    ctx.strokeStyle='rgba(255,210,63,0.6)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(20,26,20,-0.9,0.6); ctx.stroke();
  }
  ctx.restore();
}
function drawEnemy(e){
  const x=e.x-cam, y=e.y;
  ctx.save();
  if(e.hitFlash>0){ ctx.globalAlpha=0.6; e.hitFlash--; }
  if(e.kind==='sentinel'){
    ctx.fillStyle='#7b4fd0'; ctx.fillRect(x,y,e.w,e.h);          // purple body
    ctx.fillStyle='#9d78e0'; ctx.fillRect(x+4,y+4,e.w-8,10);     // chest
    ctx.fillStyle='#ff5a5a'; ctx.fillRect(x+e.w/2-4,y+8,8,5);    // eye visor
    ctx.fillStyle='#5a3aa0'; ctx.fillRect(x+3,y+e.h-10,7,10); ctx.fillRect(x+e.w-10,y+e.h-10,7,10);
  } else { // normy gym bro
    ctx.fillStyle='#8a8f96'; ctx.fillRect(x+4,y+10,e.w-8,e.h-10); // tank top gray
    ctx.fillStyle='#c9a27a'; ctx.fillRect(x+6,y,e.w-12,12);       // head
    ctx.fillStyle='#c9a27a'; ctx.fillRect(x-2,y+12,6,6); ctx.fillRect(x+e.w-4,y+12,6,6); // arms
    ctx.fillStyle='#444'; ctx.fillRect(x-6,y+13,6,4); ctx.fillRect(x+e.w,y+13,6,4);       // dumbbells
  }
  ctx.restore();
}
function drawBoss(){
  const b=R.boss; const x=b.x-cam, y=b.y;
  ctx.save();
  if(b.hitFlash>0){ ctx.globalAlpha=0.6; b.hitFlash--; }
  ctx.fillStyle='#caa15e'; ctx.fillRect(x,y,b.w,b.h);            // tan body
  ctx.fillStyle='#e0c184'; ctx.fillRect(x+4,y+6,b.w-8,14);       // mane/chest
  // wild mane spikes
  ctx.fillStyle='#caa15e';
  for(let i=0;i<5;i++){ ctx.beginPath(); ctx.moveTo(x+6+i*8,y); ctx.lineTo(x+10+i*8,y-10); ctx.lineTo(x+14+i*8,y); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle='#3a2a12'; ctx.fillRect(x+10,y+10,6,4); ctx.fillRect(x+b.w-16,y+10,6,4); // eyes
  ctx.fillStyle='#e9edf2'; ctx.fillRect(x+14,y+22,b.w-28,4);     // teeth
  ctx.restore();
  // boss hp bar
  const bw=120, bx=VW/2-bw/2, by=16;
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(bx-2,by-2,bw+4,12);
  ctx.fillStyle='#3a1414'; ctx.fillRect(bx,by,bw,8);
  ctx.fillStyle='#ff6a4a'; ctx.fillRect(bx,by,bw*(b.hp/b.maxHp),8);
  ctx.fillStyle='#e0c184'; ctx.font='700 11px JetBrains Mono, monospace'; ctx.textAlign='center';
  ctx.fillText('SABRETOOTH', VW/2, by-6);
}
function drawHUD(){
  const p=R.p;
  // healing factor bar
  ctx.fillStyle='#3a9d5d'; ctx.font='700 12px JetBrains Mono, monospace'; ctx.textAlign='left';
  ctx.fillText('HEALING FACTOR', 16, 22);
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(14,28,160,12);
  ctx.fillStyle='#2a1414'; ctx.fillRect(16,30,156,8);
  const hpc = p.hp>50?'#5ef38c':p.hp>25?'#ffb454':'#ff6a4a';
  ctx.fillStyle=hpc; ctx.fillRect(16,30,156*(p.hp/p.maxHp),8);
  // kill counter / objective
  ctx.fillStyle='#5ef38c'; ctx.textAlign='right'; ctx.font='500 14px JetBrains Mono, monospace';
  if(!R.boss) ctx.fillText('cleared '+R.killed+' / '+QUOTA, VW-16, 24);
  else if(!R.boss.dead) ctx.fillText('finish him.', VW-16, 24);
}

function drLoop(now){
  if(state!=='dr'||!R||R.over){ return; }
  R.raf=requestAnimationFrame(drLoop);
  R.t++;
  const p=R.p;

  // input
  const left = keys['a']||keys['arrowleft']||R._tl;
  const right= keys['d']||keys['arrowright']||R._tr;
  const jump = keys['w']||keys['arrowup']||keys[' ']||R._tj;
  if(left){ p.vx=-3.4; p.facing=-1; }
  else if(right){ p.vx=3.4; p.facing=1; }
  else p.vx*=0.6;
  if(jump && p.onGround){ p.vy=-11.5; p.onGround=false; }

  // gravity
  p.vy += 0.62; if(p.vy>16) p.vy=16;
  p.x += p.vx; p.y += p.vy;
  // world bounds
  if(p.x<0) p.x=0; if(p.x>WORLD_W*TILE-p.w) p.x=WORLD_W*TILE-p.w;

  // ground collision (surface under feet — sample center)
  const surf=surfaceYAt(p.x+p.w/2);
  p.onGround=false;
  if(p.y+p.h >= surf){ p.y=surf-p.h; p.vy=0; p.onGround=true; }
  // platform collision (landing on top only)
  platforms.forEach(pf=>{
    const py=platPixelY(pf); const px0=pf.tx*TILE, px1=px0+pf.tw*TILE;
    if(p.x+p.w>px0 && p.x<px1){
      if(p.vy>=0 && p.y+p.h>=py && p.y+p.h<=py+18){ p.y=py-p.h; p.vy=0; p.onGround=true; }
    }
  });

  if(p.atk>0) p.atk--;
  if(p.invuln>0) p.invuln--;

  // camera
  const target = p.x - VW/2 + p.w/2;
  cam += (target-cam)*0.12;
  if(cam<0) cam=0; if(cam>WORLD_W*TILE-VW) cam=WORLD_W*TILE-VW;

  // spawn
  if(!R.boss && R.killed<QUOTA){
    R.spawnT++;
    if(R.spawnT>R.spawnEvery && R.enemies.filter(e=>!e.dead).length<5){
      spawnEnemy(); R.spawnT=0; R.spawnEvery=Math.max(42, R.spawnEvery-1);
    }
  }
  if(!R.boss && R.killed>=QUOTA && R.enemies.filter(e=>!e.dead).length===0){ spawnBoss(); }

  // enemies move
  R.enemies.forEach(e=>{
    if(e.dead) return;
    e.x += e.vx;
    const es=surfaceYAt(e.x+e.w/2); e.y=es-e.h;
    // contact
    if(p.x < e.x+e.w && p.x+p.w > e.x && p.y < e.y+e.h && p.y+p.h > e.y) drHurt(8);
    // despawn far off
    if(e.x < cam-200 || e.x > cam+VW+200) e.vx*=1; // keep; walls at world edge
    if(e.x<0){ e.x=0; e.vx=Math.abs(e.vx); }
    if(e.x>WORLD_W*TILE-e.w){ e.x=WORLD_W*TILE-e.w; e.vx=-Math.abs(e.vx); }
  });
  R.enemies=R.enemies.filter(e=>!e.dead);

  // boss move
  if(R.boss && !R.boss.dead){
    const b=R.boss;
    const dir = p.x> b.x ? 1 : -1;
    b.x += dir*1.25;
    const bs=surfaceYAt(b.x+b.w/2); b.y=bs-b.h;
    if(p.x < b.x+b.w && p.x+p.w > b.x && p.y < b.y+b.h && p.y+p.h > b.y) drHurt(14);
  }

  // ---- render ----
  const shx=(Math.random()-.5)*R.shake, shy=(Math.random()-.5)*R.shake; R.shake*=0.84;
  ctx.save(); ctx.translate(shx,shy);
  drawTerrain();
  R.enemies.forEach(drawEnemy);
  if(R.boss && !R.boss.dead) drawBoss();
  drawWolverine();
  // particles
  R.parts.forEach(pt=>{ pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.14; pt.life-=0.02;
    ctx.fillStyle='rgba(255,210,63,'+Math.max(0,pt.life)+')'; ctx.fillRect(pt.x-cam,pt.y,pt.sz*pt.life,pt.sz*pt.life); });
  R.parts=R.parts.filter(pt=>pt.life>0);
  // floats
  ctx.textAlign='center';
  R.floats.forEach(f=>{ f.y-=0.7; f.life-=0.012;
    ctx.font=(f.big?'700 15px':'500 13px')+' JetBrains Mono, monospace';
    ctx.fillStyle='rgba(255,155,181,'+Math.max(0,f.life)+')'; ctx.fillText(f.t, f.x-cam, f.y); });
  R.floats=R.floats.filter(f=>f.life>0);
  ctx.restore();
  drawHUD();
}
function endDR(won){
  if(R.over) return; R.over=true; R.won=won; state='dr-over';
  cancelAnimationFrame(R.raf);
  if(R.killed>best){ best=R.killed; lsSet('wx_best',String(best)); }
  document.getElementById('dr-title').textContent = won?'SIM CLEARED':'ASSET DOWN';
  document.getElementById('dr-title').style.color = won?'#ffd23f':'#ff6a4a';
  document.getElementById('dr-msg').innerHTML = '<span class="pk">'+(won?CLEAR_REVEAL:FAIL_REVEAL)+'</span>';
  document.getElementById('dr-score').innerHTML = 'cleared '+R.killed+(won?' + boss':'')+' &nbsp;·&nbsp; best '+best;
  drEnd.style.display='flex';
  if(won) addTrust();
}

/* attack triggers */
function doAttack(){ if(R && !R.over && state==='dr' && R.p.atk<=0){ R.p.atk=12; clawHit(); } }
canvas.addEventListener('mousedown', ()=>{ if(state==='dr-ready'){ newDR(); return; } doAttack(); });

/* keyboard */
window.addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  if(dr.style.display==='block'){
    if(k==='escape'){ exitDR(); return; }
    if(state==='dr-over' && (k==='r')){ newDR(); return; }
    if((k==='j'||k==='k')){ e.preventDefault(); doAttack(); }
    if([' ','arrowup','arrowleft','arrowright','w','a','d'].includes(k)) e.preventDefault();
    keys[k]=true;
  }
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });

/* touch controls */
function bindTouch(id, on, off){
  const el=document.getElementById(id);
  const set=v=>e=>{ e.preventDefault(); if(R){ if(id==='t-left')R._tl=v; if(id==='t-right')R._tr=v; if(id==='t-jump')R._tj=v; } if(id==='t-atk'&&v) doAttack(); };
  el.addEventListener('touchstart', set(true), {passive:false});
  el.addEventListener('touchend', set(false), {passive:false});
  el.addEventListener('touchcancel', set(false), {passive:false});
}
['t-left','t-right','t-jump','t-atk'].forEach(id=>bindTouch(id));

document.getElementById('dr-go').addEventListener('click', newDR);
document.getElementById('dr-again').addEventListener('click', newDR);
drStart.addEventListener('click', e=>{ if(e.target.id==='dr-start' && state==='dr-ready') newDR(); });
window.addEventListener('resize', ()=>{ if(dr.style.display==='block') resizeDR(); });

/* ---- toast + konami ---- */
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.querySelector('.monitor').appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),360); }, 2600);
}
console.log('%c snooping in the console, cradle robber? classic. hi. ', 'color:#ff9bb5; font-size:14px;');
console.log('%c (try the konami code on the page) ', 'color:#ffb454;');
const KONAMI=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
let ki=0;
window.addEventListener('keydown', e=>{
  if(dr.style.display==='block') return;
  if(e.key===KONAMI[ki] || e.key.toLowerCase()===KONAMI[ki]){ ki++; if(ki===KONAMI.length){ ki=0; toast('cheat code? at your age? bold.'); clawRain(); } }
  else ki=0;
});
function clawRain(){
  const c=document.createElement('canvas'); c.style.cssText='position:absolute;inset:0;z-index:40;pointer-events:none';
  document.querySelector('.monitor').appendChild(c);
  const x=c.getContext('2d'); const r=c.getBoundingClientRect(); c.width=r.width; c.height=r.height;
  let hs=Array.from({length:26},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,v:2+Math.random()*4,l:18+Math.random()*16}));
  let frames=0;
  (function rain(){
    x.clearRect(0,0,c.width,c.height);
    x.strokeStyle='#e9edf2'; x.lineWidth=2; x.lineCap='round';
    hs.forEach(h=>{ h.y+=h.v; if(h.y>c.height) h.y=-20;
      for(let i=0;i<3;i++){ x.beginPath(); x.moveTo(h.x+i*5,h.y); x.lineTo(h.x+i*5,h.y+h.l); x.stroke(); }
    });
    if(frames++<300) requestAnimationFrame(rain); else c.remove();
  })();
}

/* state + go */
let state='boot';
boot();
